name: Build iOS IPA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      GOPROXY: https://proxy.golang.org,direct
      GOSUMDB: sum.golang.org
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true
      - name: Build unsigned IPA
        run: python3 scripts/build_ios.py --all-sources
      - name: Finish source snapshot
        run: |
          python3 scripts/finish_task.py --message "Add manual iOS IPA build"
          python3 scripts/sync_source.py --check
      - uses: actions/upload-artifact@v4
        with:
          name: zhenguojian-ios-unsigned
          path: dist/ios/*
          if-no-files-found: error
          retention-days: 7
